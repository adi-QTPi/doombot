<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tile Flip</title>
<script>
  (() => {
    const stored = localStorage.getItem('tile-flip.theme');
    document.documentElement.dataset.theme = stored === 'light' || stored === 'dark'
      ? stored
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  })();
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1>Tile Flip</h1>
      <div class="stats">
        <div class="stat"><span id="moves">0</span><small>moves</small></div>
        <div class="stat"><span id="time">0:00</span><small>time</small></div>
        <div class="stat"><span id="best">-</span><small>best</small></div>
      </div>
      <button id="newGame" class="ghost" type="button">New game</button>
      <button id="theme" class="ghost" type="button" aria-pressed="false">Dark</button>
    </header>

    <div id="board" class="board" role="group" aria-label="Memory board"></div>

    <p id="hint" class="hint">Flip two tiles to find a matching pair.</p>

    <footer class="foot">
      <span>8 pairs</span>
      <span>best score is saved in this browser</span>
    </footer>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="winTitle">
      <h2 id="winTitle">Solved</h2>
      <p id="winText"></p>
      <button id="playAgain" class="primary" type="button">Play again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
