<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sign in · web terminal</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1117;
    color: #d1d5db;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  form {
    width: 300px;
    padding: 22px 20px;
    background: #11161d;
    border: 1px solid #21262d;
    border-radius: 10px;
  }
  h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  p.sub { margin: 0 0 18px; color: #8b949e; font-size: 12px; }
  label { display: block; margin-bottom: 12px; color: #8b949e; font-size: 12px; }
  input {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin-top: 5px;
    padding: 7px 9px;
    background: #0d1117;
    color: #d1d5db;
    border: 1px solid #30363d;
    border-radius: 6px;
    font: inherit;
  }
  input:focus { outline: none; border-color: #3fb950; }
  button {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    background: #21262d;
    color: #d1d5db;
    border: 1px solid #30363d;
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: #30363d; }
  button[disabled] { opacity: 0.6; cursor: default; }
  #error { min-height: 17px; margin: 10px 0 0; color: #f85149; font-size: 12px; }
</style>
</head>
<body>
  <form id="form" method="post" action="/api/login">
    <h1>web terminal</h1>
    <p class="sub">sign in to continue</p>
    <label>username
      <input id="username" name="username" autocomplete="username" autofocus required />
    </label>
    <label>password
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </label>
    <button id="submit" type="submit">sign in</button>
    <p id="error" role="alert"></p>
  </form>
<script>
  const form = document.getElementById('form');
  const error = document.getElementById('error');
  const button = document.getElementById('submit');
  const username = document.getElementById('username');
  const password = document.getElementById('password');
  const next = new URLSearchParams(location.search).get('next') || '';

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    error.textContent = '';
    button.disabled = true;
    button.textContent = 'signing in...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username.value, password: password.value, next }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `sign in failed (${res.status})`);
      location.replace(body.next || '/');
      return;
    } catch (err) {
      error.textContent = err.message;
      password.value = '';
      password.focus();
    }

    button.disabled = false;
    button.textContent = 'sign in';
  });
</script>
</body>
</html>
